openapi: 3.0.3
info:
  title: DataAfrik API
  version: 1.0.0
  description: >
    API-first contract for DataAfrik domain services. All endpoints use the v1
    standard response envelope: { success, data, meta? } for success and
    { success: false, error: { code, message, details? } } for errors.
servers:
  - url: /api/v1
tags:
  - name: system
  - name: auth
  - name: blog
  - name: comments
  - name: reports
  - name: subscriptions
  - name: finance
  - name: datasets
  - name: notifications
paths:
  /:
    get:
      tags: [system]
      summary: API capability document
      responses:
        '200':
          description: API metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /system/health:
    get:
      tags: [system]
      summary: Health check
      responses:
        '200':
          description: Service is healthy
  /auth/supabase/sign-in:
    post:
      tags: [auth]
      summary: Sign in via Supabase-backed server flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authenticated
        '401':
          description: Invalid credentials
  /blog/posts:
    get:
      tags: [blog]
      summary: List blog posts
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: Posts list
  /blog/posts/{slug}:
    get:
      tags: [blog]
      summary: Fetch a post by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Post resolved
        '404':
          description: Not found
  /blog/posts/{slug}/like:
    post:
      tags: [blog]
      summary: Like a blog post
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Like accepted
  /comments/post/{postId}:
    get:
      tags: [comments]
      summary: List comments for a post
      parameters:
        - in: path
          name: postId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Comment list
  /comments:
    post:
      tags: [comments]
      summary: Create comment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Comment created
  /reports/request:
    post:
      tags: [reports]
      summary: Submit custom report request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Request accepted
  /finance/ingestion/jobs:
    post:
      tags: [finance]
      summary: Queue finance ingestion job
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  items:
                    type: object
                mapping:
                  type: object
                options:
                  type: object
      responses:
        '202':
          description: Job queued
        '200':
          description: Existing idempotent job reused
  /finance/reconciliation/jobs:
    post:
      tags: [finance]
      summary: Queue bank reconciliation job
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bankRows]
              properties:
                bankRows:
                  type: array
                  items:
                    type: object
                bankMapping:
                  type: object
                bookRows:
                  type: array
                  items:
                    type: object
                bookTransactions:
                  type: array
                  items:
                    type: object
                bookMapping:
                  type: object
                options:
                  type: object
      responses:
        '202':
          description: Job queued
        '200':
          description: Existing idempotent job reused
  /finance/reports/jobs:
    post:
      tags: [finance]
      summary: Queue financial summary report job
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transactions:
                  type: array
                  items:
                    type: object
                rows:
                  type: array
                  items:
                    type: object
                mapping:
                  type: object
                options:
                  type: object
                companyName:
                  type: string
                reportPeriod:
                  type: string
      responses:
        '202':
          description: Job queued
        '200':
          description: Existing idempotent job reused
  /finance/jobs:
    get:
      tags: [finance]
      summary: List authenticated user's finance jobs
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          description: Job list
  /finance/jobs/{jobId}:
    get:
      tags: [finance]
      summary: Get finance job status/result
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Job details
        '404':
          description: Job not found
  /finance/jobs/storage-mode:
    get:
      tags: [finance]
      summary: Get active finance job storage mode
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Storage mode info
  /subscriptions/plans:
    get:
      tags: [subscriptions]
      summary: Available plans
      responses:
        '200':
          description: Plan list
  /subscriptions/pdf-pricing:
    get:
      tags: [subscriptions]
      summary: PDF pricing
      responses:
        '200':
          description: Pricing details
  /subscriptions/pdf-checkout:
    post:
      tags: [subscriptions]
      summary: Start PDF checkout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Checkout initialized
  /subscriptions/pdf-access:
    get:
      tags: [subscriptions]
      summary: Verify PDF entitlement
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Access state
  /subscriptions/pdf-verify:
    get:
      tags: [subscriptions]
      summary: Verify checkout session/reference
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verification status
  /subscriptions/newsletter:
    post:
      tags: [subscriptions]
      summary: Subscribe email to newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Subscription result
  /datasets:
    get:
      tags: [datasets]
      summary: List the caller's stored datasets
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Datasets owned by the caller
        '401':
          description: Not authenticated
    post:
      tags: [datasets]
      summary: Start a dataset, declaring its columns
      description: >
        Step one of three. An upload is create, then append batches, then
        complete, because a dataset large enough to be worth storing on the
        server cannot fit in one request body. The dataset is in the building
        state and unreadable until completed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, columns]
              properties:
                name:
                  type: string
                  maxLength: 200
                sourceName:
                  type: string
                  maxLength: 400
                  description: Original file name, kept for display.
                columns:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [name, type]
                    properties:
                      name:
                        type: string
                      type:
                        type: string
      responses:
        '201':
          description: Dataset created in the building state
        '401':
          description: Not authenticated
        '422':
          description: Invalid request
  /datasets/limits:
    get:
      tags: [datasets]
      summary: The upload limits this server enforces
      description: >
        Published so a client can refuse an oversized upload before sending it,
        rather than discovering the limit after a long transfer.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Maximum rows per batch and related limits
  /datasets/{id}:
    get:
      tags: [datasets]
      summary: One dataset's header
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dataset header
        '404':
          description: No such dataset, or not owned by the caller
    delete:
      tags: [datasets]
      summary: Delete a dataset and its rows
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '404':
          description: No such dataset, or not owned by the caller
  /datasets/{id}/rows:
    get:
      tags: [datasets]
      summary: Page through a completed dataset's rows
      description: >
        Refused while the dataset is still building, so a partial upload can
        never be read as if it were the whole thing. An oversized limit is
        capped and the applied value is reported in meta.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: A page of rows, with meta saying whether more remain
        '409':
          description: The dataset is still building
    post:
      tags: [datasets]
      summary: Append a batch of rows to a building dataset
      description: >
        Step two of three. startIndex makes a retry idempotent - resending the
        same batch rewrites those rows rather than duplicating them.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startIndex, rows]
              properties:
                startIndex:
                  type: integer
                  minimum: 0
                  description: Position of the batch's first row in the dataset.
                rows:
                  type: array
                  minItems: 1
                  items:
                    type: object
      responses:
        '202':
          description: Batch stored
        '413':
          description: Batch larger than the transport can carry
        '422':
          description: Invalid request, or a column that was never declared
  /datasets/{id}/complete:
    post:
      tags: [datasets]
      summary: Finish a dataset, verifying the row count
      description: >
        Step three of three. The declared count is checked against what was
        actually stored; a mismatch leaves the dataset unreadable rather than
        quietly short.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRowCount]
              properties:
                expectedRowCount:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Dataset is ready to read
        '409':
          description: Stored row count does not match the declared count
  /notifications/vapid-public-key:
    get:
      tags: [notifications]
      summary: The public key a browser needs to subscribe to push
      responses:
        '200':
          description: VAPID public key
  /notifications/subscribe:
    post:
      tags: [notifications]
      summary: Register a push subscription
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Subscribed
  /notifications/unsubscribe:
    delete:
      tags: [notifications]
      summary: Remove a push subscription
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unsubscribed
  /notifications/status:
    get:
      tags: [notifications]
      summary: Whether the caller has an active push subscription
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscription status
  /notifications/admin/send-reminders:
    get:
      tags: [notifications]
      summary: Send pending reminders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reminders sent
        '403':
          description: Not an administrator
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        meta:
          type: object
          nullable: true
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
